{% extends 'accounts/base.html' %}

{% block content %}

<style>

    #eventoModal .btn-sm {
        min-width: 75px;
        font-size: 0.67rem;
        font-weight: 500;
    }


    #eventoModal .modal-footer {
        padding-top: .75rem;
        padding-bottom: .75rem;
    }


    /* =========================================
       EVENTOS DA AGENDA
       ========================================= */

    .agenda-evento-conteudo {
        width: 100%;
        overflow: hidden;
        line-height: 1.15;
    }


    .agenda-evento-hora {
        font-size: 0.72rem;
        font-weight: 700;
        white-space: nowrap;
    }


    .agenda-evento-paciente {
        font-size: 0.78rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }


    /* =========================================
       VISÃO MENSAL
       ========================================= */

    .fc-dayGridMonth-view .fc-daygrid-event {
        border-radius: 5px;
        padding: 3px 5px;
        margin-top: 2px;
        margin-bottom: 2px;
    }


    .fc-dayGridMonth-view .agenda-evento-hora {
        font-size: 0.70rem;
    }


    .fc-dayGridMonth-view .agenda-evento-paciente {
        font-size: 0.76rem;
    }


    /* =========================================
       SEMANA E DIA
       ========================================= */

    .fc-timegrid-event .agenda-evento-hora {
        font-size: 0.78rem;
    }


    .fc-timegrid-event .agenda-evento-paciente {
        font-size: 0.82rem;
    }


    /* =========================================
       BLOQUEIOS DA AGENDA
       ========================================= */

    .fc-bg-event.bloqueio-visual {
        opacity: 1 !important;
        overflow: hidden;
    }


    /* =========================================
       IDENTIFICAÇÃO DO BLOQUEIO
       ========================================= */

    .fc-bg-event.bloqueio-visual .bloqueio-label {

        position: absolute;

        inset: 0;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        text-align: center;

        padding: 4px 8px;

        pointer-events: none;

        z-index: 10;

        color: #842029;

        line-height: 1.2;

    }


    /* =========================================
       NOME DO BLOQUEIO
       ========================================= */

    .fc-bg-event.bloqueio-visual
    .bloqueio-label strong {

        display: block;

        font-size: 12px;

        font-weight: 700;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;

        max-width: 100%;

    }


    /* =========================================
       DESCRIÇÃO DO BLOQUEIO
       ========================================= */

    .fc-bg-event.bloqueio-visual
    .bloqueio-label small {

        display: block;

        margin-top: 2px;

        font-size: 10px;

        font-weight: 500;

        opacity: 0.85;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;

        max-width: 100%;

    }


    /* =========================================
       BLOQUEIO DE DIA INTEIRO
       ========================================= */

    .fc-daygrid-bg-harness
    .fc-bg-event.bloqueio-visual {

        opacity: 1 !important;

    }


</style>

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-3">

    <div>

        <h1 class="mb-3">
            Agenda
        </h1>

        <div class="d-flex justify-content-between align-items-center mb-4">

    <div class="btn-group shadow-sm" role="group">

        {% if request.user.perfil.tipo_usuario == "dentista" %}

            <a href="?modo=minha"
               class="btn {% if modo == 'clinica' %}btn-outline-primary{% else %}btn-primary{% endif %}">

                <i class="bi bi-person-circle"></i>
                Minha Agenda

            </a>

        {% endif %}

        <a href="?modo=clinica"
           class="btn {% if modo == 'clinica' %}btn-primary{% else %}btn-outline-primary{% endif %}">

            <i class="bi bi-buildings"></i>
            Agenda da Clínica

        </a>

    </div>

    <a href="{% url 'novo_agendamento' %}"
       class="btn btn-primary rounded-pill px-4">

        <i class="bi bi-plus-circle"></i>

        Novo Agendamento

    </a>

</div>

    <div id="calendar" style="
            background:white;
            padding:20px;
            border-radius:20px;
        "></div>

</div>

<!-- MODAL DO AGENDAMENTO -->

<div class="modal fade" id="eventoModal" tabindex="-1">

    <div class="modal-dialog" style="max-width:500px;">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title" id="modalPaciente">
                </h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="mb-3">

                    <span id="modalStatus" class="badge bg-primary fs-6">
                    </span>

                </div>

                <div class="mb-3">

                    <strong>Procedimento</strong>

                    <div id="modalProcedimento" class="text-muted">
                    </div>

                </div>

                <div class="mb-3">

                    <strong>Profissional</strong>

                    <div id="modalProfissional" class="text-muted">
                    </div>

                </div>

            </div>

            <div class="modal-footer">

                <div class="w-100">

                    <div class="d-flex justify-content-center gap-2 mb-2">

                        <a id="btnConfirmar" class="btn btn-success btn-sm">
                            <i class="bi bi-check-circle"></i>
                            Confirmar
                        </a>

                        <a id="btnAtendimento" class="btn btn-warning btn-sm">
                            <i class="bi bi-play-circle"></i>
                            Em Atendimento
                        </a>

                        <a id="btnFinalizar" class="btn btn-secondary btn-sm">
                            <i class="bi bi-flag"></i>
                            Finalizado
                        </a>

                        <a id="btnFalta" class="btn btn-danger btn-sm">
                            <i class="bi bi-x-circle"></i>
                            Faltou
                        </a>

                        <a id="btnCancelar" class="btn btn-dark btn-sm">
                            <i class="bi bi-slash-circle"></i>
                            Cancelar
                        </a>

                    </div>

                    <div class="d-flex justify-content-center gap-2">

                        <a id="btnPerfil" class="btn btn-outline-primary btn-sm">
                            <i class="bi bi-person"></i>
                            Perfil
                        </a>

                        <a id="btnEditar" class="btn btn-primary btn-sm">
                            <i class="bi bi-pencil-square"></i>
                            Editar
                        </a>

                        <a id="btnWhatsapp" class="btn btn-success btn-sm" target="_blank">

                            <i class="bi bi-whatsapp"></i>
                            WhatsApp

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

document.addEventListener('DOMContentLoaded', function () {

    // =====================================================
    // ESTILO VISUAL DA AGENDA
    // =====================================================

    const style = document.createElement('style');

    style.innerHTML = `

        /* =================================================
           AGENDA MENSAL
           ================================================= */

        .fc-dayGridMonth-view .fc-daygrid-event {

            border-radius: 5px !important;

            margin: 2px 4px !important;

            padding: 3px 5px !important;

            border: none !important;

            min-height: 23px;

            overflow: hidden;

        }


        /* Remove a bolinha */

        .fc-dayGridMonth-view
        .fc-daygrid-event-dot {

            display: none !important;

        }


        /* Conteúdo do evento mensal */

        .fc-dayGridMonth-view
        .fc-daygrid-event .fc-event-main {

            padding: 1px 3px !important;

        }


        /* Horário */

        .fc-dayGridMonth-view
        .fc-daygrid-event .fc-event-time {

            font-weight: 600 !important;

            font-size: 11px !important;

        }


        /* Nome */

        .fc-dayGridMonth-view
        .fc-daygrid-event .fc-event-title {

            font-size: 12px !important;

            font-weight: 600 !important;

        }


        /* Mais eventos */

        .fc-dayGridMonth-view
        .fc-daygrid-more-link {

            font-size: 12px !important;

            font-weight: 600 !important;

            margin-left: 4px !important;

        }


        /* =================================================
           SEMANA / DIA
           ================================================= */

        .fc-timegrid-event {

            border-radius: 4px !important;

        }


        .fc-timegrid-event .fc-event-main {

            padding: 3px 4px !important;

        }


        .fc-timegrid-event .fc-event-time {

            font-weight: 700 !important;

            font-size: 12px !important;

        }


        .fc-timegrid-event .fc-event-title {

            font-size: 12px !important;

            font-weight: 600 !important;

        }


        /* =================================================
           CURSOR
           ================================================= */

        .fc-timegrid-slot {

            cursor: pointer;

        }


        .fc-daygrid-day {

            cursor: pointer;

        }

    `;

    document.head.appendChild(style);


    // =====================================================
    // CSRF
    // =====================================================

    function getCookie(name) {

        let cookieValue = null;

        if (
            document.cookie &&
            document.cookie !== ''
        ) {

            const cookies =
                document.cookie.split(';');

            for (
                let i = 0;
                i < cookies.length;
                i++
            ) {

                const cookie =
                    cookies[i].trim();

                if (
                    cookie.substring(
                        0,
                        name.length + 1
                    ) ===
                    (name + '=')
                ) {

                    cookieValue =
                        decodeURIComponent(
                            cookie.substring(
                                name.length + 1
                            )
                        );

                    break;

                }

            }

        }

        return cookieValue;

    }


    // =====================================================
    // ELEMENTO DO CALENDÁRIO
    // =====================================================

    const calendarEl =
        document.getElementById('calendar');


    if (!calendarEl) {

        console.error(
            'Elemento #calendar não encontrado.'
        );

        return;

    }


    // =====================================================
    // EVENTO SELECIONADO
    // =====================================================

    let eventoSelecionado = null;


    // =====================================================
    // CALENDÁRIO
    // =====================================================

    const calendar =
        new FullCalendar.Calendar(
            calendarEl,
            {

                // =========================================
                // CONFIGURAÇÕES GERAIS
                // =========================================

                locale: 'pt-br',

                initialView:
                    'dayGridMonth',


                // =========================================
                // DIMENSÕES
                // =========================================

                height: 'auto',

                contentHeight: 'auto',

                aspectRatio: 1.8,

                expandRows: true,


                // =========================================
                // AGENDA MENSAL
                // =========================================

                dayMaxEventRows: 4,

                eventDisplay: 'block',


                // =========================================
                // EDIÇÃO
                // =========================================

                editable: true,


                // =========================================
                // GRADE DE HORÁRIOS
                // =========================================

                slotMinTime:
                    '08:00:00',

                slotMaxTime:
                    '19:00:00',

                slotDuration:
                    '00:30:00',

                slotLabelInterval:
                    '01:00:00',

                snapDuration:
                    '00:30:00',

                allDaySlot: true,


                // =========================================
// EVENTOS
// =========================================

eventSources: [

    // =====================================
    // AGENDAMENTOS
    // =====================================

    {
        url:
            '/agenda/eventos/?modo={{ modo }}',

        format:
            'json'
    },

    // =====================================
    // BLOQUEIOS
    // =====================================

    {
        url:
            '/agenda/eventos-bloqueios/?modo={{ modo }}',

        format:
            'json'
    }

],


                // =========================================
                // CABEÇALHO
                // =========================================

                headerToolbar: {

                    left:
                        'prev,next today',

                    center:
                        'title',

                    right:
                        'dayGridMonth,timeGridWeek,timeGridDay'

                },


                // =========================================
                // BOTÕES
                // =========================================

                buttonText: {

                    today: 'Hoje',

                    month: 'Mês',

                    week: 'Semana',

                    day: 'Dia'

                },


                // =========================================
                // CONTEÚDO DOS EVENTOS
                // =========================================
                //
                // IMPORTANTE:
                //
                // Aqui tratamos separadamente:
                //
                // MÊS
                // SEMANA
                // DIA
                //
                // para não perder o nome/horário.
                // =========================================

                eventContent:
                    function (arg) {

                        const hora =
                            arg.timeText || '';

                        const paciente =
                            arg.event
                                .extendedProps
                                .paciente || '';

                        const container =
                            document.createElement(
                                'div'
                            );


                        // =================================
                        // MÊS
                        // =================================

                        if (
                            arg.view.type ===
                            'dayGridMonth'
                        ) {

                            container.style.width =
                                '100%';

                            container.style.overflow =
                                'hidden';


                            const texto =
                                document.createElement(
                                    'span'
                                );

                            texto.textContent =
                                hora
                                +
                                (
                                    hora && paciente
                                        ? ' '
                                        : ''
                                )
                                +
                                paciente;


                            texto.style.display =
                                'block';

                            texto.style.whiteSpace =
                                'nowrap';

                            texto.style.overflow =
                                'hidden';

                            texto.style.textOverflow =
                                'ellipsis';


                            container.appendChild(
                                texto
                            );


                            return {

                                domNodes: [
                                    container
                                ]

                            };

                        }


                        // =================================
                        // SEMANA / DIA
                        // =================================

                        const horaEl =
                            document.createElement(
                                'div'
                            );

                        horaEl.textContent =
                            hora;

                        horaEl.style.fontWeight =
                            '700';

                        horaEl.style.fontSize =
                            '12px';


                        const pacienteEl =
                            document.createElement(
                                'div'
                            );

                        pacienteEl.textContent =
                            paciente;

                        pacienteEl.style.fontWeight =
                            '600';

                        pacienteEl.style.fontSize =
                            '12px';


                        container.appendChild(
                            horaEl
                        );

                        container.appendChild(
                            pacienteEl
                        );


                        return {

                            domNodes: [
                                container
                            ]

                        };

                    },


                // =========================================
                // CLIQUE EM HORÁRIO VAZIO
                // =========================================

                dateClick:
                    function (info) {

                        // ---------------------------------
                        // DATA LOCAL
                        // ---------------------------------

                        const data =
                            info.date.getFullYear()
                            +
                            '-'
                            +
                            String(
                                info.date.getMonth() + 1
                            ).padStart(2, '0')
                            +
                            '-'
                            +
                            String(
                                info.date.getDate()
                            ).padStart(2, '0');


                        // ---------------------------------
                        // SEMANA / DIA
                        // ---------------------------------

                        const ehGradeHoraria =
                            info.view.type ===
                                'timeGridWeek'
                            ||
                            info.view.type ===
                                'timeGridDay';


                        // ---------------------------------
                        // URL
                        // ---------------------------------

                        let url =
                            "{% url 'novo_agendamento' %}"
                            +
                            "?data="
                            +
                            encodeURIComponent(
                                data
                            );


                        // =================================
                        // HORÁRIO
                        // =================================

                        if (ehGradeHoraria) {

                            const hora =
                                String(
                                    info.date.getHours()
                                ).padStart(2, '0');


                            const minutoNumero =
                                info.date.getMinutes();


                            // ---------------------------------
                            // GRADE DE 30 MINUTOS
                            // ---------------------------------

                            if (
                                minutoNumero % 30 !== 0
                            ) {

                                alert(
                                    'Selecione um horário disponível na grade da agenda.'
                                );

                                return;

                            }


                            const minuto =
                                String(
                                    minutoNumero
                                ).padStart(2, '0');


                            const horaFormatada =
                                hora
                                +
                                ':'
                                +
                                minuto;


                            url +=
                                '&hora='
                                +
                                encodeURIComponent(
                                    horaFormatada
                                );

                        }


                        // =================================
                        // ABRE NOVO AGENDAMENTO
                        // =================================

                        window.location.href =
                            url;

                    },


                // =========================================
// TOOLTIP / BLOQUEIOS
// =========================================

eventDidMount:
    function (info) {

        // =====================================
        // BLOQUEIO DA AGENDA
        // =====================================

        if (
            info.event
                .extendedProps
                .bloqueio
        ) {

            const tipo =
                info.event
                    .extendedProps
                    .tipo
                    || '';

            const descricao =
                info.event
                    .extendedProps
                    .descricao
                    || '';

            const profissional =
                info.event
                    .extendedProps
                    .profissional
                    || '';


            // =================================
            // CLASSE VISUAL
            // =================================

            info.el.classList.add(
                'bloqueio-visual'
            );


            // =================================
            // CONTAINER DO TEXTO
            // =================================

            const label =
                document.createElement(
                    'div'
                );

            label.className =
                'bloqueio-label';


            // =================================
            // TEXTO PRINCIPAL
            // =================================

            const textoPrincipal =
                document.createElement(
                    'strong'
                );

            textoPrincipal.textContent =
                '🔒 ' + tipo;

            label.appendChild(
                textoPrincipal
            );


            // =================================
            // DESCRIÇÃO
            // =================================

            if (
                descricao
                &&
                descricao !== tipo
            ) {

                const textoDescricao =
                    document.createElement(
                        'small'
                    );

                textoDescricao.textContent =
                    descricao;

                label.appendChild(
                    textoDescricao
                );

            }


            // =================================
            // PROFISSIONAL
            // =================================

            if (
                profissional
                &&
                profissional !==
                    'Toda a clínica'
            ) {

                const textoProfissional =
                    document.createElement(
                        'small'
                    );

                textoProfissional.textContent =
                    profissional;

                label.appendChild(
                    textoProfissional
                );

            }


            // =================================
            // INSERE O TEXTO NO BLOQUEIO
            // =================================

            info.el.appendChild(
                label
            );


            // =================================
            // TOOLTIP DO BLOQUEIO
            // =================================

            info.el.title =
                tipo
                +
                (
                    descricao
                        ? '\n' + descricao
                        : ''
                )
                +
                (
                    profissional
                    &&
                    profissional !==
                        'Toda a clínica'
                        ? '\n' + profissional
                        : ''
                );


            // =================================
            // IMPORTANTE
            // Não tratar como paciente
            // =================================

            return;

        }


        // =====================================
        // EVENTO NORMAL — PACIENTE
        // =====================================

        info.el.title =
            'Paciente: ' +
            (
                info.event
                    .extendedProps
                    .paciente || ''
            )
            +
            '\nStatus: ' +
            (
                info.event
                    .extendedProps
                    .status || ''
            )
            +
            '\nProcedimento: ' +
            (
                info.event
                    .extendedProps
                    .procedimento || ''
            )
            +
            '\nProfissional: ' +
            (
                info.event
                    .extendedProps
                    .profissional || ''
            );

    },


                // =========================================
                // CLIQUE NO EVENTO
                // =========================================

                eventClick:
                    function (info) {

                        eventoSelecionado =
                            info.event;

                        info.jsEvent.preventDefault();


                        // ---------------------------------
                        // PACIENTE
                        // ---------------------------------

                        const pacienteEl =
                            document.getElementById(
                                'modalPaciente'
                            );

                        if (pacienteEl) {

                            pacienteEl.innerText =
                                info.event
                                    .extendedProps
                                    .paciente || '';

                        }


                        // ---------------------------------
                        // STATUS
                        // ---------------------------------

                        const statusEl =
                            document.getElementById(
                                'modalStatus'
                            );

                        if (statusEl) {

                            const status =
                                info.event
                                    .extendedProps
                                    .status || '';

                            statusEl.innerText =
                                status;

                            statusEl.className =
                                'badge fs-6';


                            if (
                                status ===
                                'Confirmado'
                            ) {

                                statusEl.classList.add(
                                    'bg-success'
                                );

                            }

                            else if (
                                status ===
                                'Em Atendimento'
                            ) {

                                statusEl.classList.add(
                                    'bg-warning'
                                );

                            }

                            else if (
                                status ===
                                'Finalizado'
                            ) {

                                statusEl.classList.add(
                                    'bg-secondary'
                                );

                            }

                            else {

                                statusEl.classList.add(
                                    'bg-primary'
                                );

                            }

                        }


                        // ---------------------------------
                        // PROCEDIMENTO
                        // ---------------------------------

                        const procedimentoEl =
                            document.getElementById(
                                'modalProcedimento'
                            );

                        if (procedimentoEl) {

                            procedimentoEl.innerText =
                                info.event
                                    .extendedProps
                                    .procedimento || '';

                        }


                        // ---------------------------------
                        // PROFISSIONAL
                        // ---------------------------------

                        const profissionalEl =
                            document.getElementById(
                                'modalProfissional'
                            );

                        if (profissionalEl) {

                            profissionalEl.innerText =
                                info.event
                                    .extendedProps
                                    .profissional || '';

                        }


                        // ---------------------------------
                        // PERFIL
                        // ---------------------------------

                        const btnPerfil =
                            document.getElementById(
                                'btnPerfil'
                            );

                        if (btnPerfil) {

                            btnPerfil.href =
                                info.event
                                    .extendedProps
                                    .perfil_url || '#';

                        }


                        // ---------------------------------
                        // EDITAR
                        // ---------------------------------

                        const btnEditar =
                            document.getElementById(
                                'btnEditar'
                            );

                        if (btnEditar) {

                            btnEditar.href =
                                info.event
                                    .extendedProps
                                    .editar_url || '#';

                        }


                        // ---------------------------------
                        // ATENDIMENTO
                        // ---------------------------------

                        const btnAtendimento =
                            document.getElementById(
                                'btnAtendimento'
                            );

                        if (btnAtendimento) {

                            btnAtendimento.href =
                                info.event
                                    .extendedProps
                                    .iniciar_url || '#';

                        }


                        // ---------------------------------
                        // WHATSAPP
                        // ---------------------------------

                        const btnWhatsapp =
                            document.getElementById(
                                'btnWhatsapp'
                            );

                        if (btnWhatsapp) {

                            btnWhatsapp.href =
                                info.event
                                    .extendedProps
                                    .whatsapp_url || '#';

                        }


                        // ---------------------------------
                        // MODAL
                        // ---------------------------------

                        const modalEl =
                            document.getElementById(
                                'eventoModal'
                            );

                        if (modalEl) {

                            const modal =
                                new bootstrap.Modal(
                                    modalEl
                                );

                            modal.show();

                        }

                    },


                // =========================================
                // MOVER AGENDAMENTO
                // =========================================

                eventDrop:
                    function (info) {

                        fetch(
                            '/agenda/mover-agendamento/',
                            {

                                method: 'POST',

                                headers: {

                                    'Content-Type':
                                        'application/json',

                                    'X-CSRFToken':
                                        getCookie(
                                            'csrftoken'
                                        )

                                },

                                body:
                                    JSON.stringify({

                                        agendamento_id:
                                            info.event.id,

                                        nova_data:
                                            info.event.startStr

                                    })

                            }
                        )

                        .then(
                            response =>
                                response.json()
                        )

                        .then(
                            data => {

                                if (
                                    !data.sucesso
                                ) {

                                    alert(
                                        data.mensagem
                                        ||
                                        'Erro ao mover agendamento.'
                                    );

                                    info.revert();

                                }

                            }
                        )

                        .catch(
                            error => {

                                console.error(
                                    error
                                );

                                alert(
                                    'Erro ao mover agendamento.'
                                );

                                info.revert();

                            }
                        );

                    }

            }
        );


    // =====================================================
    // ALTERAR STATUS
    // =====================================================

    function alterarStatus(status) {

        if (!eventoSelecionado) {

            return;

        }


        fetch(
            '/agenda/alterar-status/',
            {

                method: 'POST',

                headers: {

                    'Content-Type':
                        'application/json',

                    'X-CSRFToken':
                        getCookie(
                            'csrftoken'
                        )

                },

                body:
                    JSON.stringify({

                        agendamento_id:
                            eventoSelecionado.id,

                        status:
                            status

                    })

            }
        )

        .then(
            response =>
                response.json()
        )

        .then(
            data => {

                if (data.sucesso) {

                    let cor =
                        '#0d6efd';


                    if (
                        status ===
                        'confirmado'
                    ) {

                        cor =
                            '#198754';

                    }

                    else if (
                        status ===
                        'atendimento'
                    ) {

                        cor =
                            '#f89847';

                    }

                    else if (
                        status ===
                        'finalizado'
                    ) {

                        cor =
                            '#6c757d';

                    }

                    else if (
                        status ===
                        'cancelado'
                    ) {

                        cor =
                            '#382a2b';

                    }

                    else if (
                        status ===
                        'faltou'
                    ) {

                        cor =
                            '#e93636';

                    }


                    eventoSelecionado.setProp(
                        'backgroundColor',
                        cor
                    );

                    eventoSelecionado.setProp(
                        'borderColor',
                        cor
                    );


                    const modalEl =
                        document.getElementById(
                            'eventoModal'
                        );


                    if (modalEl) {

                        const modal =
                            bootstrap.Modal
                                .getInstance(
                                    modalEl
                                );


                        if (modal) {

                            modal.hide();

                        }

                    }

                }

                else {

                    alert(
                        data.mensagem
                        ||
                        'Não foi possível alterar o status.'
                    );

                }

            }
        )

        .catch(
            error => {

                console.error(
                    error
                );

                alert(
                    'Erro ao alterar o status do agendamento.'
                );

            }
        );

    }


    // =====================================================
    // BOTÃO CONFIRMAR
    // =====================================================

    const btnConfirmar =
        document.getElementById(
            'btnConfirmar'
        );

    if (btnConfirmar) {

        btnConfirmar.addEventListener(
            'click',
            function (e) {

                e.preventDefault();

                alterarStatus(
                    'confirmado'
                );

            }
        );

    }


    // =====================================================
    // BOTÃO FALTA
    // =====================================================

    const btnFalta =
        document.getElementById(
            'btnFalta'
        );

    if (btnFalta) {

        btnFalta.addEventListener(
            'click',
            function (e) {

                e.preventDefault();

                alterarStatus(
                    'faltou'
                );

            }
        );

    }


    // =====================================================
    // BOTÃO CANCELAR
    // =====================================================

    const btnCancelar =
        document.getElementById(
            'btnCancelar'
        );

    if (btnCancelar) {

        btnCancelar.addEventListener(
            'click',
            function (e) {

                e.preventDefault();

                alterarStatus(
                    'cancelado'
                );

            }
        );

    }


    // =====================================================
    // BOTÃO FINALIZAR
    // =====================================================

    const btnFinalizar =
        document.getElementById(
            'btnFinalizar'
        );

    if (btnFinalizar) {

        btnFinalizar.addEventListener(
            'click',
            function (e) {

                e.preventDefault();

                alterarStatus(
                    'finalizado'
                );

            }
        );

    }


    // =====================================================
    // RENDERIZA O CALENDÁRIO
    // =====================================================

    calendar.render();

});

</script>

{% endblock %}
