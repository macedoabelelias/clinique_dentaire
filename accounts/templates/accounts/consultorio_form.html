{% extends 'accounts/base.html' %}

{% block content %}

<div class="container-fluid py-4">

    <!-- =========================================
         CABEÇALHO
    ========================================== -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h4 class="fw-semibold mb-1">
                <i class="bi bi-door-open me-2"></i>
                Novo Consultório
            </h4>

            <p class="text-muted mb-0">
                Cadastre um consultório para utilização na agenda.
            </p>
        </div>

        <a
            href="{% url 'lista_consultorios' %}"
            class="btn btn-outline-secondary"
        >
            <i class="bi bi-arrow-left me-1"></i>
            Voltar
        </a>

    </div>


    <!-- =========================================
         FORMULÁRIO
    ========================================== -->

    <div class="card shadow-sm border-0">

        <div class="card-header bg-white py-3">

            <div class="d-flex align-items-center">

                <i class="bi bi-door-open me-2 text-primary"></i>

                <span class="fw-semibold">
                    Dados do Consultório
                </span>

            </div>

        </div>


        <div class="card-body">

            <form method="post">

                {% csrf_token %}


                <!-- NOME -->

                <div class="mb-4">

                    <label
                        for="id_nome"
                        class="form-label fw-semibold"
                    >
                        Nome do consultório
                    </label>

                    <input
                        type="text"
                        name="nome"
                        id="id_nome"
                        class="form-control"
                        maxlength="100"
                        placeholder="Ex.: Consultório 01"
                        required
                        autofocus
                    >

                </div>


                <!-- DESCRIÇÃO -->

                <div class="mb-4">

                    <label
                        for="id_descricao"
                        class="form-label fw-semibold"
                    >
                        Descrição
                    </label>

                    <input
                        type="text"
                        name="descricao"
                        id="id_descricao"
                        class="form-control"
                        maxlength="255"
                        placeholder="Ex.: Consultório principal"
                    >

                    <div class="form-text">
                        Campo opcional.
                    </div>

                </div>


                <!-- STATUS -->

                <div class="mb-4">

                    <div class="form-check form-switch">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            name="ativo"
                            id="id_ativo"
                            checked
                        >

                        <label
                            class="form-check-label fw-semibold"
                            for="id_ativo"
                        >
                            Consultório ativo
                        </label>

                    </div>

                    <div class="form-text">
                        Consultórios inativos não deverão ser utilizados
                        para novos agendamentos.
                    </div>

                </div>


                <!-- BOTÕES -->

                <div class="d-flex justify-content-end gap-2 pt-3 border-top">

                    <a
                        href="{% url 'lista_consultorios' %}"
                        class="btn btn-outline-secondary"
                    >
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        <i class="bi bi-check-lg me-1"></i>
                        Salvar Consultório
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
